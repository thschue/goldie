name: release-please

# Skeleton: opens and maintains the release PR on main. Publishing the image,
# the Helm chart and the binaries on tag is added by the release issue.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
