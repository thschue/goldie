name: release-please

# Skeleton: opens and maintains the release PR on main. Publishing the image,
# the Helm chart and the binaries on tag is added by the release issue.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A push with GITHUB_TOKEN starts no workflows, so the release PR would get no CI.
          # RELEASE_PLEASE_TOKEN (a fine-grained token or App token with contents and
          # pull-requests write) makes CI run on it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
