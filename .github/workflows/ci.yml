name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `./run check` split into its four groups, run in parallel.
  check:
    name: check (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [lint, spec, harness, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Pinned tools (`./run` installs each version into its own directory, and
      # their modules into .tools/mod). Directories are named by version, so a
      # restored older cache is safe: only a bumped tool is rebuilt. Each job
      # has its own key: with a shared one, the first job to finish saves only
      # its own tools and the others never get cached.
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The binaries, plus the module zips they are built from (192 MB rather
          # than about 1 GB extracted): a bumped tool rebuilds without downloads.
          path: |
            .tools/*-v*
            .tools/mod/cache/download
          key: tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-${{ hashFiles('run') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-
      - name: Cache golangci-lint analysis
        if: matrix.group == 'lint'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('run', '.golangci.yml', 'go.mod') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-
      - name: ./run check-${{ matrix.group }}
        run: ./run check-${{ matrix.group }}

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The binaries, plus the module zips they are built from (192 MB rather
          # than about 1 GB extracted): a bumped tool rebuilds without downloads.
          path: |
            .tools/*-v*
            .tools/mod/cache/download
          key: tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-${{ hashFiles('run') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-
      - name: ./run vuln
        run: ./run vuln

  # `./run ux`: screenshots at 375, 768 and 1280 px in light and dark, and axe,
  # uploaded as the `ux` artifact for the UX review. Fails on an axe violation.
  ux:
    name: ux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./web/package-lock.json').packages['node_modules/@playwright/test'].version")" >>"$GITHUB_OUTPUT"
      # The browsers, keyed on the Playwright version that downloads them.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: ./run ux
        run: ./run ux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ux
          path: ux/
          if-no-files-found: error

  # `./run regen-ts-check`: the TypeScript types match the spec. Its own job, so a
  # stale web/src/api/schema.ts blocks the merge through `lint and test`.
  regen-ts-check:
    name: regen-ts-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: ./run regen-ts-check
        run: ./run regen-ts-check

  # The required status check. Its name is what the main ruleset requires.
  lint-and-test:
    name: lint and test
    if: always()
    needs: [check, vuln, regen-ts-check]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          CHECK: ${{ needs.check.result }}
          VULN: ${{ needs.vuln.result }}
          TS_TYPES: ${{ needs.regen-ts-check.result }}
        run: |
          echo "check: $CHECK, govulncheck: $VULN, regen-ts-check: $TS_TYPES"
          [ "$TS_TYPES" = success ] || echo "regen-ts-check failed: see that job's log; fix with ./run regen"
          [ "$CHECK" = success ] && [ "$VULN" = success ] && [ "$TS_TYPES" = success ]

  # Informational: whether the PR needs the maintainer (docs/agents/README.md#gates).
  # It runs main's copy of the gate, so a PR can't loosen the gate that judges it.
  agent-gate:
    name: agent-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The binaries, plus the module zips they are built from (192 MB rather
          # than about 1 GB extracted): a bumped tool rebuilds without downloads.
          path: |
            .tools/*-v*
            .tools/mod/cache/download
          key: tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-${{ hashFiles('run') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-
      - name: Gate
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          gate=scripts/agent-gate
          export GATE_RUN="$PWD/run" GOLDIE_TOOLS="$PWD/.tools"
          if git cat-file -e "$BASE:scripts/agent-gate" 2>/dev/null; then
            git show "$BASE:scripts/agent-gate" >"$RUNNER_TEMP/agent-gate"
            git show "$BASE:run" >"$RUNNER_TEMP/run"
            chmod +x "$RUNNER_TEMP/agent-gate" "$RUNNER_TEMP/run"
            gate="$RUNNER_TEMP/agent-gate"
            export GATE_RUN="$RUNNER_TEMP/run"
          fi
          status=0
          out=$("$gate" "$BASE" HEAD) || status=$?
          {
            echo "## agent-gate"
            case "$status" in
            0) echo "No hard gate: this PR may auto-merge after a clean review."
               if [ -n "$out" ]; then echo; echo "The reviewer judges whether these are significant:"; echo; printf '%s\n' "$out" | sed 's/^review: /- /'; fi ;;
            1) echo "Needs the maintainer:"; echo; printf '%s\n' "$out" | sed 's/^gate: /- /; s/^review: /- (reviewer) /' ;;
            *) echo "The gate failed to run (exit $status):"; echo; printf '%s\n' "$out" ;;
            esac
          } >>"$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$out"
          [ "$status" -le 1 ]
