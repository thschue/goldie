name: ci

on:
  pull_request:
  # The merge queue (ADR 0018) runs the required check on the merge group.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `./run check` split into its four groups, run in parallel.
  check:
    name: check (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [lint, spec, harness, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Pinned tools (`./run` installs each version into its own directory, and
      # their modules into .tools/mod). Directories are named by version, so a
      # restored older cache is safe: only a bumped tool is rebuilt. Each job
      # has its own key: with a shared one, the first job to finish saves only
      # its own tools and the others never get cached.
      - name: Cache pinned tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The binaries, plus the module zips they are built from (192 MB rather
          # than about 1 GB extracted): a bumped tool rebuilds without downloads.
          path: |
            .tools/*-v*
            .tools/mod/cache/download
          key: tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-${{ hashFiles('run') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-
      - name: Cache golangci-lint analysis
        if: matrix.group == 'lint'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('run', '.golangci.yml', 'go.mod') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-
      - name: ./run check-${{ matrix.group }}
        run: ./run check-${{ matrix.group }}

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Cache pinned tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The binaries, plus the module zips they are built from (192 MB rather
          # than about 1 GB extracted): a bumped tool rebuilds without downloads.
          path: |
            .tools/*-v*
            .tools/mod/cache/download
          key: tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-${{ hashFiles('run') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-
      - name: ./run vuln
        run: ./run vuln

  # The required status check. Its name is what the main ruleset requires.
  lint-and-test:
    name: lint and test
    if: always()
    needs: [check, vuln]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          CHECK: ${{ needs.check.result }}
          VULN: ${{ needs.vuln.result }}
        run: |
          echo "check: $CHECK, govulncheck: $VULN"
          [ "$CHECK" = success ] && [ "$VULN" = success ]

  # Informational: whether the PR needs the maintainer (docs/agents/README.md#gates).
  # It runs main's copy of the gate, so a PR can't loosen the gate that judges it.
  agent-gate:
    name: agent-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Cache pinned tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The binaries, plus the module zips they are built from (192 MB rather
          # than about 1 GB extracted): a bumped tool rebuilds without downloads.
          path: |
            .tools/*-v*
            .tools/mod/cache/download
          key: tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-${{ hashFiles('run') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ github.job }}${{ matrix.group }}-
      - name: Gate
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          gate=scripts/agent-gate
          export GATE_RUN="$PWD/run" GOLDIE_TOOLS="$PWD/.tools"
          if git cat-file -e "$BASE:scripts/agent-gate" 2>/dev/null; then
            git show "$BASE:scripts/agent-gate" >"$RUNNER_TEMP/agent-gate"
            git show "$BASE:run" >"$RUNNER_TEMP/run"
            chmod +x "$RUNNER_TEMP/agent-gate" "$RUNNER_TEMP/run"
            gate="$RUNNER_TEMP/agent-gate"
            export GATE_RUN="$RUNNER_TEMP/run"
          fi
          status=0
          out=$("$gate" "$BASE" HEAD) || status=$?
          {
            echo "## agent-gate"
            case "$status" in
            0) echo "No hard gate: this PR may auto-merge after a clean review."
               if [ -n "$out" ]; then echo; echo "The reviewer judges whether these are significant:"; echo; printf '%s\n' "$out" | sed 's/^review: /- /'; fi ;;
            1) echo "Needs the maintainer:"; echo; printf '%s\n' "$out" | sed 's/^gate: /- /; s/^review: /- (reviewer) /' ;;
            *) echo "The gate failed to run (exit $status):"; echo; printf '%s\n' "$out" ;;
            esac
          } >>"$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$out"
          [ "$status" -le 1 ]

  lint-pr-title:
    name: lint-pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            build
            ci
            chore
            perf
            style
            revert
