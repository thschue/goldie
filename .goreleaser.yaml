# Release binaries (#890). Built by the release-please workflow after a release
# is created, and as a snapshot on every PR (ci.yml). Run it from a clean tree.
version: 2

before:
  hooks:
    # The SPA is embedded at build time (ADR 0019). Without it the binary would
    # serve the placeholder, so build it first and fail when it is missing
    # (ui.Built(), internal/ui/ui.go).
    - ./run ui
    # Hooks are not run through a shell, so the check is an explicit sh -c.
    - sh -c 'test -f internal/ui/dist/app/index.html || { echo "the embedded UI is the placeholder, ./run ui built no index.html" >&2; exit 1; }'

builds:
  - id: goldie
    main: ./cmd/goldie
    binary: goldie
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/thschue/goldie/internal/platform.Version={{.Version}}
      - -X github.com/thschue/goldie/internal/platform.Commit={{.FullCommit}}
      - -X github.com/thschue/goldie/internal/platform.BuildDate={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: goldie
    formats: [tar.gz]
    name_template: "goldie_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

# release-please writes the changelog and creates the release; goreleaser only
# attaches the archives and checksums to it.
changelog:
  disable: true

release:
  mode: keep-existing
