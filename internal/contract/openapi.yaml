openapi: 3.1.0
info:
  title: Goldie API
  summary: Golden-path knowledge for humans and agents.
  description: |
    The public HTTP API of the goldie server. This document is the contract:
    the Go and TypeScript types are generated from it, and it is served by the
    server itself at `/openapi.yaml` and `/openapi.json`.

    The admin endpoints (`/livez`, `/readyz`, `/version`) are served on the
    separate admin port and are not part of this document.
  version: 0.1.0
  contact:
    name: Goldie maintainers
    url: https://github.com/thschue/goldie
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
    description: The public listener that served this document.
security:
  - bearerAuth: []
tags:
  - name: contract
    description: The API contract itself.
  - name: articles
    description: Search and look up articles.
  - name: projects
    description: The Projects whose Scope the server holds.
  - name: sync
    description: How the server's content sync is doing, for operators.
  - name: activity
    description: The live view of recent searches and lookups, for operators.
  - name: session
    description: Browser sign-in with a token, as a signed session cookie.
paths:
  /api/v1/search:
    get:
      operationId: searchArticles
      tags:
        - articles
      summary: Search articles by keyword
      description: |
        Returns the articles that match the search words, best first. An exact
        keyword match scores 4, a keyword containing the word 1, and a name
        containing the word 2. Ties are ordered by id. No match is an empty
        list, not an error.
      parameters:
        - name: q
          in: query
          required: true
          description: Search words, separated by spaces. Matching ignores case.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
          example: deploy kubernetes
        - name: project
          in: query
          required: false
          description: |
            Resolve for this Project (ADR 0020): its articles come before the
            global ones and win on an equal id. Matched ignoring case. A Project
            that is not registered answers the global results with a `hint`; a
            value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The matching articles, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: The search words are missing or longer than 1024 bytes, or `project` is not a `ProjectId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The search asked for drafts with a token whose role is not operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/articles/{id}:
    get:
      operationId: getArticle
      tags:
        - articles
      summary: Look up one article
      description: |
        Returns one article by its id. Ids compare ignoring case. A miss is a
        404 whose hint points to search.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The article id: its path under `articles/` without `.md` (ADR 0015).
            The id is one path segment (ADR 0016). A `/` inside a nested id is
            sent percent-encoded as `%2F`, as generated clients do:
            `platform/deploy` is requested as `/api/v1/articles/platform%2Fdeploy`.
            A bare slash (`/api/v1/articles/platform/deploy`) is not an article
            lookup and answers the not-found envelope. Ids in response bodies
            are always decoded.
          schema:
            type: string
            minLength: 1
          example: platform/deploy
        - name: project
          in: query
          required: false
          description: |
            Look the article up for this Project (ADR 0020): its own article
            wins over the global one with the same id. Matched ignoring case.
            An unregistered Project answers the global article with a `hint`; a
            value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: '`project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No bearer token, or a wrong one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The lookup asked for drafts with a token whose role is not operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No article has this id; the hint points to search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      tags:
        - projects
      summary: List the registered Projects
      description: |
        Returns the Projects the server holds Scope for, sorted, as
        `host/org/repo` in the case they are stored in. A server with none
        answers an empty list. Pass one as `project` on search and lookup.
      responses:
        "200":
          description: The Projects the server holds, sorted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          description: No bearer token was sent, or it is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      tags:
        - projects
      summary: Read one registered Project
      description: |
        Returns the Project's id, in the case the server stores it, and the
        global Items its `project.yaml` suppresses (ADR 0021) as
        `<kind>:<id>` (for example `article:style` or `agent:reviewer`), sorted. A Project that suppresses nothing answers an
        empty list. A lookup of a suppressed Item answers 404 with a hint that
        names the Suppression and the file that sets it, and search leaves it
        out.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The Project as one path segment (ADR 0016): the `/` inside
            `host/org/repo` is sent percent-encoded as `%2F`, so
            `github.com/acme/shop` is requested as
            `/api/v1/projects/github.com%2Facme%2Fshop`. Matched ignoring case.
            A bare-slash path is not a Project detail and answers the not-found
            envelope; a value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
          example: github.com/acme/shop
      responses:
        "200":
          description: The Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          description: The id is not a `ProjectId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No bearer token, or a wrong one; the body shows no Suppressions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The server holds no such Project; the hint says how to register it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/items:
    get:
      operationId: getProjectItems
      tags:
        - projects
      summary: Export a Project's resolved view
      description: |
        Returns the articles that win in the Project's view (Resolution): the
        Project's own copy over the global one with the same id, every global
        Item the Project does not shadow or suppress, and no draft. Only
        winners are sent: nothing of another Project and no shadowed copy.
        Sorted by `id`, ascending. Each Item carries its `scope` and whether it
        is `enforced`, so an embedded server can build on this view and check
        that a local Item does not shadow an enforced one. The Project's
        Suppressions (ADR 0021) are listed as in `getProject`.

        A Project the server does not hold is answered with the global view and
        a `hint`, as search and lookup do. A view over the export limit, the
        same 16 MiB the goldie client reads, is refused whole with 422
        `view_too_large`; it is never truncated, because a partial view would
        hide enforced Items.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The Project as one path segment (ADR 0016): the `/` inside
            `host/org/repo` is sent percent-encoded as `%2F`. Matched ignoring
            case. A bare-slash path is not this route and answers the not-found
            envelope; a value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
          example: github.com/acme/shop
      responses:
        "200":
          description: The Project's resolved view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectView"
              example:
                items:
                  - id: platform/deploy
                    name: Deploying to Kubernetes
                    keywords:
                      - kubernetes
                      - deploy
                    content: Use the platform chart.
                    status: published
                    scope: github.com/acme/shop
                    enforced: false
                suppressions:
                  - article:platform/notes
        "400":
          description: The id sent is not a valid `ProjectId`; the body does not repeat it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No bearer token, or a wrong one; the body shows no Item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: |
            The view is over the export limit; the error code is
            `view_too_large`. Nothing of the view is sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/session:
    post:
      operationId: postSession
      security: []
      tags:
        - session
      summary: Sign in with a token and get a session cookie
      description: |
        Exchanges a configured API token, sent as `token` in the JSON body,
        for a signed session cookie, so a browser never holds the token. The
        cookie is `HttpOnly`, `SameSite=Strict` and `Path=/`, and over TLS
        `Secure` with the `__Host-` prefix; on a plain-http loopback listener
        (`goldie server --dev`) `Secure` and the prefix are dropped. It holds
        the token's name and its times, signed (ADR 0027), never the token or
        its role, and expires after a short idle time and at an absolute
        limit; each use re-issues it. The cookie authenticates `GET` and
        `HEAD` requests only, and a bearer token beats it. This operation takes
        no bearer token: the token in the body is the credential, and a
        cross-origin request is refused with a 403. The response is
        `Cache-Control: no-store`.
      requestBody:
        required: true
        description: The API token to sign in with.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
            example:
              token: replace-with-a-configured-api-token
      responses:
        "200":
          description: The token is valid; the session cookie is in `Set-Cookie`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                name: ci-reader
                role: reader
        "401":
          description: The body holds no configured token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: getSession
      tags:
        - session
      summary: Read who the session cookie signs in
      description: |
        Returns the name and the current role of the token behind a valid
        session cookie (or a bearer token). The role is read from the
        configuration on each request, so a change shows at once, and a token
        removed from it ends the session. Any other request is a 401. The
        response is `Cache-Control: no-store`.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                name: ci-reader
                role: reader
        "401":
          description: No valid session cookie or bearer token was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      security: []
      tags:
        - session
      summary: Sign out
      description: |
        Clears the session cookie. A cross-origin request is refused with a
        403, so another site cannot sign a user out. The response is
        `Cache-Control: no-store`.
      responses:
        "204":
          description: The cookie is cleared in `Set-Cookie`.
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sync:
    get:
      operationId: getSync
      x-goldie-role: operator
      tags:
        - sync
      summary: Read the content sync status and warnings
      description: |
        Returns, per Source, the revision served and when it was last polled,
        when that last succeeded and why it last failed, and the findings of the
        last content load that did not fail it, for
        operator tokens only, such as a `suppress` reference that names nothing
        in a Project's `project.yaml`. Each warning names a file relative to the
        Source root and shows what the Source wrote escaped to printable ASCII
        and cut, which is why only operators read them. `goldie validate` prints
        the same warnings for a content directory.
      responses:
        "200":
          description: The warnings of the current content, empty when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
              example:
                sources:
                  - revision: 3f786850e387550fdab836ed7e6dc881de23001b
                    last_poll: "2026-11-23T10:00:00Z"
                    last_success: "2026-11-23T10:00:00Z"
                warnings:
                  - file: projects/github.com/acme/shop/project.yaml
                    message: suppress "article:team/gone" names no published Item this Project can see
        "401":
          description: No bearer token was sent for the sync status, or it is not a configured token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: A reader token was sent for the sync status; only an operator token may read it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: postSync
      x-goldie-role: operator
      tags:
        - sync
      summary: Poll the Source now
      description: |
        Starts one poll of the Source now instead of waiting for
        `GOLDIE_POLL_INTERVAL`, for operator tokens only, and answers at once
        without waiting for it, for example after merging into the repository a
        git Source reads. Read the outcome from `GET /api/v1/sync`: `last_poll`
        moves when the poll ends, `revision` when it found a new commit, and
        `last_error` when it failed. The request takes no body. At most one
        poll runs at a time.
      responses:
        "202":
          description: A poll was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncTriggered"
              example:
                hint: A poll was started. Read GET /api/v1/sync to see its outcome.
        "401":
          description: No bearer token was sent to trigger a poll, or it is not a configured token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: A reader token was sent to trigger a poll; only an operator token may.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          description: |
            A poll is already running, so none was started (`error.code` is
            `sync_running`), or the token sent more requests than
            `GOLDIE_RATE_LIMIT` allows (`rate_limited`, with `Retry-After`).
            Wait, then read `GET /api/v1/sync`.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/activity:
    get:
      operationId: getActivity
      x-goldie-role: operator
      tags:
        - activity
      summary: Stream recent searches and lookups
      parameters:
        - name: replicas
          in: query
          required: false
          description: |
            `all` merges the streams of every replica (see the description);
            without it the stream is this replica's own. Any other value, and
            a repeated parameter, is a 400.
          schema:
            type: string
            enum:
              - all
      description: |
        Streams this server process's recent searches and lookups as
        server-sent events, for operator tokens only. The stream opens with the
        retained events in `id` order, oldest first, then one event of type
        `live` whose `data` is `{}` (an `ActivityLive`), sent even when there
        is no history, then each new event as it is recorded. It is a live
        view, not an audit log: the buffer is bounded and shared, so any
        reader's requests push older events out of it, and a restart empties
        it.

        With `replicas=all` the stream merges this replica's stream with one
        per peer, as `GOLDIE_ACTIVITY_PEERS` names them; without peers it is
        this replica's stream. An event of type `replica_status` (an
        `ActivityReplicaStatus`) says a peer is down, and again when it is
        back; those for peers that are down when the stream opens come before
        the merged history. Each peer is asked with the caller's own token for
        its own events only, and checks the operator role itself. A peer is
        down when its stream ends or falls silent, or sends no `live` marker.
        An event that reached the merge after its reorder window carries
        `late: true`, and `dropped` counts the merge's own losses. At most 16
        peers are merged; the rest are ignored.

        Every event is one SSE event whose `data` is one line of JSON, an
        `ActivityEvent`. Its `id` increases per server process (per replica)
        and starts again at 1 when the process restarts; `replica` names the
        replica that recorded it. All text is escaped
        as JSON strings, so no query can end an event or start one. A
        subscriber that cannot keep up loses events and then gets an event of
        type `dropped`, an `ActivityDropped` with the number lost, before the
        next event. Clients must ignore SSE event types and JSON fields they
        do not know.

        Events carry no SSE `id:` field and the server does not resume from
        `Last-Event-ID`: a reconnect replays the retained history, so on
        reconnect clients replace their view with the history before `live`.
        Within one connection they dedupe by `replica` and `id`; across
        connections ids are no key, because they start again at 1 when a
        replica restarts under the same name. An idle stream sends the
        comment `: keepalive` every 15 seconds. The stream costs one
        rate-limit token when it opens, and ends at the server's first stop
        signal. At most 32 streams are open per server process, and at most 8
        of them with `replicas=all`, each of which costs a stream on every
        peer; one more is a 503 whose hint says to retry later. The history
        before `live` holds at most 10,000 events per replica, so a merged
        history can be larger, and the Go client reads at most 16 MiB of the
        stream before `live`.

        Go clients use `StreamActivity` on the client `NewAPIClient` builds:
        `GetActivityWithResponse` reads the whole body, so it does not return
        until the stream ends.
      responses:
        "200":
          description: |
            The event stream, not an audit log. Sent with
            `Cache-Control: no-store`; the headers are sent before the first
            event, at once, except with `replicas=all`, which first waits up to
            a few seconds for its peers.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE events. The `data` of each is one line of JSON, one of
                  `contentSchema`: an `ActivityEvent` for an event without a
                  type, an `ActivityDropped` for `dropped`, an
                  `ActivityReplicaStatus` for `replica_status` and an
                  `ActivityLive` for `live`.
                contentSchema:
                  oneOf:
                    - $ref: "#/components/schemas/ActivityEvent"
                    - $ref: "#/components/schemas/ActivityDropped"
                    - $ref: "#/components/schemas/ActivityReplicaStatus"
                    - $ref: "#/components/schemas/ActivityLive"
              example: |
                data: {"id":1,"time":"2026-11-23T10:00:00Z","kind":"search","query":"deploy","project":"","token":"ci","client_version":"1.5.0","trace_id":"","miss":false,"replica":"goldie-0","late":false}

                event: live
                data: {}
        "400":
          description: '`replicas` is not `all`, or is repeated.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The bearer token is missing or not a configured token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The token is valid but its role is not operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |
            The server cannot open a stream: it has not loaded its content yet
            (code `not_ready`), it already serves the most streams it allows
            (code `too_many_streams`), or it is shutting down (code
            `shutting_down`). The hint says when to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      tags:
        - contract
      summary: Get the OpenAPI document as YAML
      description: Returns this document in YAML form.
      responses:
        "200":
          description: The OpenAPI document in YAML form.
          content:
            application/yaml:
              schema:
                type: string
              example: "openapi: 3.1.0"
        default:
          $ref: "#/components/responses/Error"
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      tags:
        - contract
      summary: Get the OpenAPI document as JSON
      description: Returns this document in JSON form. It is equivalent to the YAML form.
      responses:
        "200":
          description: The OpenAPI document in JSON form.
          content:
            application/json:
              schema:
                type: object
              example:
                openapi: 3.1.0
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A goldie token, sent as `Authorization: Bearer <token>`. Swagger UI's
        "Authorize" button takes it, so "Try it out" sends it. The server
        enforces it on every `/api/` path, where a missing or wrong token is a
        401, and limits each token's requests (`GOLDIE_RATE_LIMIT`), where a
        token over its limit is a 429 with `Retry-After`. An operation for
        operators only, such as `/api/v1/activity` and `/api/v1/sync`, answers other tokens with a
        403; those operations carry the machine-readable mark `x-goldie-role: operator`. A parameter value for operators only,
        `drafts=true`, carries the same mark on `components/parameters/Drafts`. The OpenAPI document and Swagger UI are not yet covered; the auth
        work (#11) adds them.
  parameters:
    Drafts:
      name: drafts
      in: query
      required: false
      x-goldie-role: operator
      description: |
        `true` includes draft Items too, marked `status: draft`; for operator
        tokens only, and a reader token asking for drafts is a 403. Without
        it a draft is left out for every token and never shadows, so the
        published Item answers. Even with drafts, a draft Project article
        never shadows an enforced global Item (ADR 0021). MCP never asks
        for drafts.
      schema:
        type: boolean
  schemas:
    SearchResults:
      type: object
      description: The result of a search.
      examples:
        - query: kubernetes
          results:
            - id: platform/deploy
              name: Deploying to Kubernetes
              kind: article
              scope: global
              keywords:
                - kubernetes
                - deploy
              score: 6
              matched:
                - kubernetes
                - name
      required:
        - query
        - results
      properties:
        query:
          type: string
          description: The search words as received.
          examples:
            - deploy kubernetes
        results:
          type: array
          description: The matching articles, best first, then by id.
          items:
            $ref: "#/components/schemas/SearchHit"
          examples:
            - []
        hint:
          type: string
          minLength: 1
          description: |
            Present when the request named a Project that is not registered: the
            results are the global ones, and this says what to do next.
          examples:
            - The Project github.com/acme/none is not registered on this server, so this is global guidance only. To register it, add a projects/github.com/acme/none/ directory to one of goldie's Sources, usually through the platform team.
    ProjectId:
      type: string
      description: |
        A Project: exactly three segments `host/org/repo` (ADR 0020). The host
        is a lower-case DNS name that starts with a letter or digit; the org and
        the repo use letters, digits, `.`, `_` and `-` and do not start with a
        dot. Clients send it lower-cased; the server matches it ignoring case.
      pattern: '^[a-z0-9][a-z0-9.-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*$'
      maxLength: 512
      examples:
        - github.com/acme/shop
    ProjectList:
      type: object
      description: The Projects the server holds Scope for.
      required:
        - projects
      properties:
        projects:
          type: array
          description: The Projects, sorted.
          items:
            $ref: "#/components/schemas/ProjectId"
          examples:
            - - github.com/acme/shop
    ProjectDetail:
      type: object
      description: One registered Project and what its `project.yaml` suppresses.
      required:
        - id
        - suppressions
      properties:
        id:
          $ref: "#/components/schemas/ProjectId"
        suppressions:
          type: array
          description: |
            The global Items the Project suppresses, as `<kind>:<id>` (for example
            `article:style` or `agent:reviewer`), sorted.
            A reference that names nothing is not listed. Empty when there are none.
          items:
            type: string
          examples:
            - - article:platform/notes
              - article:style
    ProjectView:
      type: object
      description: A Project's resolved view, the winning Items and what it suppresses.
      required:
        - items
        - suppressions
      properties:
        items:
          type: array
          description: The winning Items, sorted by `id`, ascending. No draft.
          examples:
            - []
          items:
            $ref: "#/components/schemas/ProjectItem"
        suppressions:
          type: array
          description: |
            The global Items the Project suppresses, as `<kind>:<id>`, sorted.
            Empty when there are none.
          items:
            type: string
          examples:
            - - article:platform/notes
        hint:
          type: string
          minLength: 1
          description: |
            Present when the request named a Project that is not registered: the
            view is the global one, and this says what to do next.
          examples:
            - The Project github.com/acme/none is not registered on this server, so this is global guidance only. To register it, add a projects/github.com/acme/none/ directory to one of goldie's Sources, usually through the platform team.
    ProjectItem:
      type: object
      description: One winning Item of a Project's view.
      required:
        - id
        - name
        - keywords
        - content
        - status
        - scope
        - enforced
      properties:
        id:
          type: string
          description: The Item id, its path under `articles/` without `.md`.
          examples:
            - platform/deploy
        name:
          type: string
          description: The Item display title, from its frontmatter.
          examples:
            - Deploying to Kubernetes
        keywords:
          type: array
          description: The Item keywords from its frontmatter, lower case.
          items:
            type: string
          examples:
            - - kubernetes
              - deploy
        content:
          type: string
          description: The Markdown body of the Item, after the frontmatter. Untrusted, it comes from a Source; render it without raw HTML.
          examples:
            - "Use the platform chart."
        status:
          type: string
          description: The Item's lifecycle, always present. Clients ignore values they do not know.
          enum:
            - published
            - deprecated
          x-enum-varnames:
            - ProjectItemStatusPublished
            - ProjectItemStatusDeprecated
          examples:
            - published
        replaced_by:
          type: string
          description: |
            The reference to the Item that replaces this one, as written in its
            frontmatter, `<kind>:<name>` (ADR 0021). Present only when the Item
            names a replacement. It comes from a Source and is untrusted.
          examples:
            - article:platform/deploy-v2
        scope:
          type: string
          description: '`global`, or the Project (`host/org/repo`) whose copy won.'
          examples:
            - github.com/acme/shop
        enforced:
          type: boolean
          description: Whether the Item is enforced, as its frontmatter says.
    SessionRequest:
      type: object
      description: The token to sign in with.
      required:
        - token
      additionalProperties: false
      properties:
        token:
          type: string
          description: A configured API token, in plain text.
          examples:
            - replace-with-a-configured-api-token
    Session:
      type: object
      description: Who a session signs in.
      required:
        - name
        - role
      additionalProperties: false
      properties:
        name:
          type: string
          description: The name of the token behind the session.
          examples:
            - ci-reader
        role:
          type: string
          description: The token's role, read from the configuration now.
          examples:
            - reader
          enum:
            - reader
            - operator
    SyncStatus:
      type: object
      description: How the last content load went, for operators.
      required:
        - warnings
        - sources
      properties:
        sources:
          examples:
            - - revision: 3f786850e387550fdab836ed7e6dc881de23001b
                last_poll: "2026-11-23T10:00:00Z"
                last_success: "2026-11-23T10:00:00Z"
          type: array
          description: One entry per Source. This server has exactly one.
          items:
            $ref: "#/components/schemas/SourceSyncStatus"
        warnings:
          type: array
          description: Load findings that did not fail the load, in load order.
          items:
            $ref: "#/components/schemas/ContentWarning"
          examples:
            - - file: projects/github.com/acme/shop/project.yaml
                message: suppress "article:team/gone" names no published Item this Project can see
    SourceSyncStatus:
      type: object
      description: How polling one Source is going.
      properties:
        revision:
          type: string
          description: |
            The commit the served content comes from. Absent for a Source
            without revisions, such as a directory.
          examples:
            - 3f786850e387550fdab836ed7e6dc881de23001b
        last_poll:
          x-lint-ignore: camel-case-properties
          type: string
          format: date-time
          description: When the last poll ended, whether it succeeded or not. Absent before the first poll ends.
        last_success:
          x-lint-ignore: camel-case-properties
          type: string
          format: date-time
          description: When the last poll that loaded the content ended. Absent before the first one.
        last_error:
          x-lint-ignore: camel-case-properties
          type: string
          description: |
            Why the last poll failed, absent when it succeeded. It names a file
            relative to the Source root and never a host path, URL or
            credential. The served content stays the last good one.
          examples:
            - "global/articles/sub/bad.md: frontmatter not closed with ---"
    SyncTriggered:
      type: object
      description: The answer to starting a poll.
      required:
        - hint
      properties:
        hint:
          type: string
          description: What to do next.
          examples:
            - A poll was started. Read GET /api/v1/sync to see its outcome.
    ContentWarning:
      type: object
      description: |
        One finding of a content load that did not fail it, such as a `suppress`
        reference that names nothing. It shows what a Source wrote, escaped to
        printable ASCII and cut, which is why only operators read it.
      required:
        - file
        - message
      properties:
        file:
          type: string
          description: The file the finding is about, relative to the Source root.
          examples:
            - projects/github.com/acme/shop/project.yaml
        message:
          type: string
          description: What is wrong, printable ASCII, at most 1 KiB with the file.
          examples:
            - suppress "article:team/gone" names no published Item this Project can see
    SearchHit:
      type: object
      description: One article that matched a search.
      examples:
        - id: platform/deploy
          name: Deploying to Kubernetes
          kind: article
          scope: global
          keywords:
            - kubernetes
            - deploy
          score: 6
          matched:
            - kubernetes
            - name
      required:
        - id
        - name
        - kind
        - scope
        - keywords
        - score
        - matched
      properties:
        id:
          type: string
          description: The article id, for a lookup.
          examples:
            - platform/deploy
        name:
          type: string
          description: The display title from the frontmatter.
          examples:
            - Deploying to Kubernetes
        kind:
          type: string
          description: The Kind of the Item, such as `article` (ADR 0005).
          examples:
            - article
        scope:
          type: string
          description: Where the Item applies, such as `global` (ADR 0005).
          examples:
            - global
        keywords:
          type: array
          description: The article's keywords, lower case.
          items:
            type: string
          examples:
            - - kubernetes
              - deploy
        score:
          type: integer
          minimum: 1
          description: The relevance score; higher is better.
          examples:
            - 6
        matched:
          type: array
          description: What matched, in order of first match - keywords, and `name` when the name matched.
          items:
            type: string
          examples:
            - - kubernetes
              - name
        status:
          $ref: "#/components/schemas/ItemStatus"
        replaced_by:
          type: string
          description: |
            The reference to the Item that replaces this one, as written in its
            frontmatter, `<kind>:<name>` (ADR 0021). Present only when the Item
            is not published (deprecated or draft) and names a replacement. It
            comes from a Source and is untrusted.
          examples:
            - article:platform/deploy-v2
    ItemStatus:
      type: string
      description: |
        An Item's lifecycle when it is not published: `deprecated` (still
        served; read `replaced_by` instead when present) or `draft` (only with
        `drafts=true`, for operators). Absent for a published Item. Clients
        ignore values they do not know.
      enum:
        - deprecated
        - draft
      x-enum-varnames:
        - ItemStatusDeprecated
        - ItemStatusDraft
      examples:
        - deprecated
    Article:
      type: object
      description: One article.
      required:
        - id
        - name
        - keywords
        - content
      properties:
        id:
          type: string
          description: The article id, its path under `articles/` without `.md`.
          examples:
            - platform/deploy
        name:
          type: string
          description: The article's display title, from its frontmatter.
          examples:
            - Deploying to Kubernetes
        keywords:
          type: array
          description: The keywords from the article's frontmatter, lower case.
          items:
            type: string
          examples:
            - - kubernetes
              - deploy
        content:
          type: string
          description: The Markdown body after the frontmatter. It comes from a Source and is untrusted; render it without raw HTML.
          examples:
            - "Use the platform chart."
        hint:
          type: string
          minLength: 1
          description: |
            Present when the request named a Project that is not registered: the
            article is the global one, and this says what to do next.
          examples:
            - The Project github.com/acme/none is not registered on this server, so this is global guidance only. To register it, add a projects/github.com/acme/none/ directory to one of goldie's Sources, usually through the platform team.
        status:
          $ref: "#/components/schemas/ItemStatus"
        replaced_by:
          type: string
          description: |
            The reference to the Item that replaces this article, as written
            in its frontmatter, `<kind>:<name>` (ADR 0021). Present only when
            the article is not published (deprecated or draft) and names a
            replacement. It comes from a Source and is untrusted: clean it
            before printing it.
          examples:
            - article:platform/deploy-v2
    ActivityEvent:
      type: object
      description: |
        One search or lookup on the activity stream, the `data` of an SSE
        event without a type. Every field is always sent; text fields are `""`
        when empty. Clients ignore fields they do not know.
      additionalProperties: false
      required:
        - id
        - time
        - kind
        - query
        - project
        - token
        - client_version
        - trace_id
        - miss
        - replica
        - late
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Increases per server process (per replica); starts again at 1 on restart.
          examples:
            - 42
        time:
          type: string
          format: date-time
          description: When the server recorded the request.
          examples:
            - "2026-11-23T10:00:00Z"
        kind:
          type: string
          enum:
            - search
            - lookup
          x-enum-varnames:
            - ActivityKindSearch
            - ActivityKindLookup
          description: A search or a lookup.
          examples:
            - search
        query:
          type: string
          description: The search words, or the article id a lookup asked for, as text.
          examples:
            - deploy kubernetes
        project:
          type: string
          description: The registered spelling of the Project, an unregistered id lower-cased, or `""`.
          examples:
            - github.com/acme/shop
        token:
          type: string
          description: The name of the token that sent the request, never its secret.
          examples:
            - ci-reader
        client_version:
          type: string
          description: 'The version in `X-Goldie-Client: goldie/<version>`, or `""`.'
          examples:
            - 1.5.0
        trace_id:
          type: string
          description: The request's trace id, or `""` without a span.
          examples:
            - 4bf92f3577b34da6a3ce929d0e0e4736
        miss:
          type: boolean
          description: A search with no results, or a lookup answering 404.
          examples:
            - false
        replica:
          type: string
          description: |
            The name of the replica that recorded the event: the first label of
            its host name (a StatefulSet pod name), or `goldie`. Never an
            address.
          examples:
            - goldie-0
        late:
          type: boolean
          description: |
            The event reached a merge of replicas' streams after its reorder
            window, so it is out of time order. Always `false` on a replica's
            own stream.
          examples:
            - false
    ActivityDropped:
      type: object
      description: |
        The `data` of an SSE event of type `dropped`: this subscriber lost
        events because it did not keep up. Clients ignore fields they do not
        know.
      additionalProperties: false
      required:
        - dropped
      properties:
        dropped:
          type: integer
          format: int64
          minimum: 1
          description: How many events were lost before the next one.
          examples:
            - 3
    ActivityReplicaStatus:
      type: object
      description: |
        The `data` of an SSE event of type `replica_status`, on a stream with
        `replicas=all`: a peer is down, or up again. A peer that is up when
        the stream opens gets none. Clients ignore fields they do not know.
      additionalProperties: false
      required:
        - replica
        - up
        - last_seen
      properties:
        replica:
          type: string
          description: |
            The name of the peer, the first label of its pod name. Never an
            address.
          examples:
            - goldie-1
        up:
          type: boolean
          description: Whether the peer's stream is open.
          examples:
            - false
        last_seen:
          type: string
          format: date-time
          description: When the merge last heard from the peer, or attached it.
          examples:
            - "2026-11-23T10:00:00Z"
    ActivityLive:
      type: object
      description: |
        The `data` of the one SSE event of type `live`: the events before it
        are the history, the events after it are live.
      additionalProperties: false
      properties: {}
    ErrorEnvelope:
      type: object
      description: The body of every error response.
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      description: One error. It never contains addresses, paths or stack traces.
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          description: A stable, machine-readable error code.
          examples:
            - not_found
        message:
          type: string
          description: A short, human-readable explanation.
          examples:
            - no such endpoint
        details:
          description: Next-step hints for the caller.
          $ref: "#/components/schemas/ErrorDetails"
    ErrorDetails:
      type: object
      description: |
        Next-step hints for the caller, and nothing else. It never echoes the
        request and never contains addresses, ports, hostnames, paths or stack
        traces. It is required, so a client can always read it, and always
        carries a hint.
      additionalProperties: false
      required:
        - hint
      properties:
        hint:
          type: string
          minLength: 1
          description: What the caller can do next.
          examples:
            - Check the request path against the OpenAPI document.
            - Pass project as host/org/repo, for example github.com/acme/shop. Leave it out to get global guidance only.
  responses:
    Error:
      x-go-name: ErrorResponse
      description: An error, in the error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpgradeRequired:
      description: |
        The request named a goldie client older than `GOLDIE_MIN_CLIENT_VERSION`
        in its `X-Goldie-Client: goldie/<version>` header. The hint names the
        minimum version: upgrade goldie, then retry. Requests without the
        header, or whose header is not `goldie/<semver>`, are not refused;
        requests without a valid token are rejected with 401 first, and a
        refused request does not count against the rate limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotReady:
      description: |
        The server has not loaded its content yet, so it cannot answer; the
        error code is `not_ready`. Retry shortly. Once this server process has
        loaded its content it never answers this again, even if a later load
        fails; a restarted or new process starts unloaded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: |
        The token sent more requests than `GOLDIE_RATE_LIMIT` allows. The limit
        is per token name and per server process; requests without a valid
        token are rejected with 401 first and never count. Wait the seconds in
        `Retry-After`, then retry.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  headers:
    RetryAfter:
      description: Whole seconds until the token may send a request again, rounded up; at least 1.
      schema:
        type: integer
        minimum: 1
      example: 30
