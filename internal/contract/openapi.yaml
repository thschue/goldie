          examples:
            - goldie-0
        late:
          type: boolean
          description: |
            The event reached a merge of replicas' streams after its reorder
            window, so it is out of time order. Always `false` on a replica's
            own stream.
          examples:
            - false
    ActivityDropped:
      type: object
      description: |
        The `data` of an SSE event of type `dropped`: this subscriber lost
        events because it did not keep up. Clients ignore fields they do not
        know.
      additionalProperties: false
      required:
        - dropped
      properties:
        dropped:
          type: integer
          format: int64
          minimum: 1
          description: How many events were lost before the next one.
          examples:
            - 3
    ActivityReplicaStatus:
      type: object
      description: |
        The `data` of an SSE event of type `replica_status`, on a stream with
        `replicas=all`: a peer is down, or up again. A peer that is up when
        the stream opens gets none. Clients ignore fields they do not know.
      additionalProperties: false
      required:
        - replica
        - up
        - last_seen
      properties:
        replica:
          type: string
          description: |
            The name of the peer, the first label of its pod name. Never an
            address.
          examples:
            - goldie-1
        up:
          type: boolean
          description: Whether the peer's stream is open.
          examples:
            - false
        last_seen:
          type: string
          format: date-time
          description: When the merge last heard from the peer, or attached it.
          examples:
            - "2026-11-23T10:00:00Z"
    ActivityLive:
      type: object
      description: |
        The `data` of the one SSE event of type `live`: the events before it
        are the history, the events after it are live.
      additionalProperties: false
      properties: {}
    ErrorEnvelope:
      type: object
      description: The body of every error response.
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      description: One error. It never contains addresses, paths or stack traces.
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          description: A stable, machine-readable error code.
          examples:
            - not_found
        message:
          type: string
          description: A short, human-readable explanation.
          examples:
            - no such endpoint
        details:
          description: Next-step hints for the caller.
          $ref: "#/components/schemas/ErrorDetails"
    ErrorDetails:
      type: object
      description: |
        Next-step hints for the caller, and nothing else. It never echoes the
        request and never contains addresses, ports, hostnames, paths or stack
        traces. It is required, so a client can always read it, and always
        carries a hint.
      additionalProperties: false
      required:
        - hint
      properties:
        hint:
          type: string
          minLength: 1
          description: What the caller can do next.
          examples:
            - Check the request path against the OpenAPI document.
            - Pass project as host/org/repo, for example github.com/acme/shop. Leave it out to get global guidance only.
  responses:
    Error:
      x-go-name: ErrorResponse
      description: An error, in the error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpgradeRequired:
      description: |
        The request named a goldie client older than `GOLDIE_MIN_CLIENT_VERSION`
        in its `X-Goldie-Client: goldie/<version>` header. The hint names the
        minimum version: upgrade goldie, then retry. Requests without the
        header, or whose header is not `goldie/<semver>`, are not refused;
        requests without a valid token are rejected with 401 first, and a
        refused request does not count against the rate limit. `goldie mcp` and
        the server's `/mcp` add `X-Goldie-Via: mcp`, which the gate does not read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotReady:
      description: |
        The server has not loaded its content yet, so it cannot answer; the
        error code is `not_ready`. Retry shortly. Once this server process has
        loaded its content it never answers this again, even if a later load
        fails; a restarted or new process starts unloaded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: |
        The token sent more requests than `GOLDIE_RATE_LIMIT` allows. The limit
        is per token name and per server process; requests without a valid
        token are rejected with 401 first and never count. Wait the seconds in
        `Retry-After`, then retry.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  headers:
    RetryAfter:
      description: Whole seconds until the token may send a request again, rounded up; at least 1.
      schema:
        type: integer
        minimum: 1
      example: 30
