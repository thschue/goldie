openapi: 3.1.0
info:
  title: Goldie API
  summary: Golden-path knowledge for humans and agents.
  description: |
    The public HTTP API of the goldie server. This document is the contract:
    the Go and TypeScript types are generated from it, and it is served by the
    server itself at `/openapi.yaml` and `/openapi.json`.

    The admin endpoints (`/livez`, `/readyz`, `/version`) are served on the
    separate admin port and are not part of this document.
  version: 0.1.0
  contact:
    name: Goldie maintainers
    url: https://github.com/thschue/goldie
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
    description: The public listener that served this document.
security:
  - bearerAuth: []
tags:
  - name: contract
    description: The API contract itself.
  - name: articles
    description: Search and look up articles.
paths:
  /api/v1/search:
    get:
      operationId: searchArticles
      tags:
        - articles
      summary: Search articles by keyword
      description: |
        Returns the articles that match the search words, best first. An exact
        keyword match scores 4, a keyword containing the word 1, and a name
        containing the word 2. Ties are ordered by id. No match is an empty
        list, not an error.
      parameters:
        - name: q
          in: query
          required: true
          description: Search words, separated by spaces. Matching ignores case.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
          example: deploy kubernetes
      responses:
        "200":
          description: The matching articles, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: The search words are missing or longer than 1024 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/articles/{id}:
    get:
      operationId: getArticle
      tags:
        - articles
      summary: Look up one article
      description: |
        Returns one article by its id. Ids compare ignoring case. A miss is a
        404 whose hint points to search.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The article id: its path under `articles/` without `.md` (ADR 0015).
            A nested id contains `/`, which is sent percent-encoded as `%2F`,
            as generated clients do.
          schema:
            type: string
            minLength: 1
          example: platform/deploy
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          description: No bearer token, or a wrong one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No article has this id; the hint points to search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      tags:
        - contract
      summary: Get the OpenAPI document as YAML
      description: Returns this document in YAML form.
      responses:
        "200":
          description: The OpenAPI document in YAML form.
          content:
            application/yaml:
              schema:
                type: string
              example: "openapi: 3.1.0"
        default:
          $ref: "#/components/responses/Error"
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      tags:
        - contract
      summary: Get the OpenAPI document as JSON
      description: Returns this document in JSON form. It is equivalent to the YAML form.
      responses:
        "200":
          description: The OpenAPI document in JSON form.
          content:
            application/json:
              schema:
                type: object
              example:
                openapi: 3.1.0
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A goldie token, sent as `Authorization: Bearer <token>`. Swagger UI's
        "Authorize" button takes it, so "Try it out" sends it. The server
        enforces it on every `/api/` path, where a missing or wrong token is a
        401. The OpenAPI document and Swagger UI are not yet covered; the auth
        work (#11) adds them.
  schemas:
    SearchResults:
      type: object
      description: The result of a search.
      examples:
        - query: kubernetes
          results:
            - id: platform/deploy
              name: Deploying to Kubernetes
              keywords:
                - kubernetes
                - deploy
              score: 6
              matched:
                - kubernetes
                - name
      required:
        - query
        - results
      properties:
        query:
          type: string
          description: The search words as received.
          examples:
            - deploy kubernetes
        results:
          type: array
          description: The matching articles, best first, then by id.
          items:
            $ref: "#/components/schemas/SearchHit"
          examples:
            - []
    SearchHit:
      type: object
      description: One article that matched a search.
      examples:
        - id: platform/deploy
          name: Deploying to Kubernetes
          keywords:
            - kubernetes
            - deploy
          score: 6
          matched:
            - kubernetes
            - name
      required:
        - id
        - name
        - keywords
        - score
        - matched
      properties:
        id:
          type: string
          description: The article id, for a lookup.
          examples:
            - platform/deploy
        name:
          type: string
          description: The display title from the frontmatter.
          examples:
            - Deploying to Kubernetes
        keywords:
          type: array
          description: The article's keywords, lower case.
          items:
            type: string
          examples:
            - - kubernetes
              - deploy
        score:
          type: integer
          minimum: 1
          description: The relevance score; higher is better.
          examples:
            - 6
        matched:
          type: array
          description: What matched, in order of first match - keywords, and `name` when the name matched.
          items:
            type: string
          examples:
            - - kubernetes
              - name
    Article:
      type: object
      description: One article.
      required:
        - id
        - name
        - keywords
        - content
      properties:
        id:
          type: string
          description: The article id, its path under `articles/` without `.md`.
          examples:
            - platform/deploy
        name:
          type: string
          description: The article's display title, from its frontmatter.
          examples:
            - Deploying to Kubernetes
        keywords:
          type: array
          description: The keywords from the article's frontmatter, lower case.
          items:
            type: string
          examples:
            - - kubernetes
              - deploy
        content:
          type: string
          description: The Markdown body after the frontmatter. It comes from a Source and is untrusted; render it without raw HTML.
          examples:
            - "Use the platform chart."
    ErrorEnvelope:
      type: object
      description: The body of every error response.
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      description: One error. It never contains addresses, paths or stack traces.
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          description: A stable, machine-readable error code.
          examples:
            - not_found
        message:
          type: string
          description: A short, human-readable explanation.
          examples:
            - no such endpoint
        details:
          description: Next-step hints for the caller.
          $ref: "#/components/schemas/ErrorDetails"
    ErrorDetails:
      type: object
      description: |
        Next-step hints for the caller, and nothing else. It never echoes the
        request and never contains addresses, ports, hostnames, paths or stack
        traces. It is required, so a client can always read it, and always
        carries a hint.
      additionalProperties: false
      required:
        - hint
      properties:
        hint:
          type: string
          minLength: 1
          description: What the caller can do next.
          examples:
            - Check the request path against the OpenAPI document.
  responses:
    Error:
      x-go-name: ErrorResponse
      description: An error, in the error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
