openapi: 3.1.0
info:
  title: Goldie API
  summary: Golden-path knowledge for humans and agents.
  description: |
    The public HTTP API of the goldie server. This document is the contract:
    the Go and TypeScript types are generated from it, and it is served by the
    server itself at `/openapi.yaml` and `/openapi.json`.

    The admin endpoints (`/livez`, `/readyz`, `/version`) are served on the
    separate admin port and are not part of this document.
  version: 0.1.0
  contact:
    name: Goldie maintainers
    url: https://github.com/thschue/goldie
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
    description: The public listener that served this document.
security:
  - bearerAuth: []
tags:
  - name: contract
    description: The API contract itself.
  - name: articles
    description: Search and look up articles.
  - name: skills
    description: List and read skill bundles.
  - name: agents
    description: List and read agent definitions.
  - name: loops
    description: List and read loop definitions with their resolved closure.
  - name: instructions
    description: The managed instruction block for a repository's CLAUDE.md or AGENTS.md.
  - name: bundle
    description: The resolved skills and agents as an archive, for goldie pull.
  - name: projects
    description: The Projects whose Scope the server holds.
  - name: sync
    description: How the server's content sync is doing, for operators.
  - name: activity
    description: The live view of recent searches and lookups, for operators.
  - name: session
    description: Browser sign-in with a token, as a signed session cookie.
paths:
  /api/v1/search:
    get:
      operationId: searchArticles
      tags:
        - articles
      summary: Search articles, skills and agents by keyword
      description: |
        Returns the Items of one Kind that match the search words, best first.
        Without `kind` only articles are searched, so a client that follows a hit
        with an article lookup keeps working. An exact keyword match scores 4, a
        keyword containing the word 1, and a name containing the word 2. A skill
        or agent matches on its name and keywords only, never on its
        description (ADR 0005); a skill's keywords are the `keywords` in the
        frontmatter of its `SKILL.md`. Ties are ordered by id. No match is an
        empty list, not an error. A skill or agent hit's `id` is its name: read
        it with `GET /api/v1/skills/{name}` or `GET /api/v1/agents/{name}`.
      parameters:
        - name: q
          in: query
          required: true
          description: Search words, separated by spaces. Matching ignores case.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
          example: deploy kubernetes
        - name: kind
          in: query
          required: false
          description: |
            The Kind of Item to search: `article` (the default), `skill` or
            `agent`. Any other value is a 400.
          schema:
            type: string
            enum:
              - article
              - skill
              - agent
        - name: project
          in: query
          required: false
          description: |
            Resolve for this Project (ADR 0020): its articles come before the
            global ones and win on an equal id. Matched ignoring case. A Project
            that is not registered answers the global results with a `hint`; a
            value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The matching Items, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: The search words are missing or longer than 1024 bytes, `kind` is not `article`, `skill` or `agent`, or `project` is not a `ProjectId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The search asked for drafts with a token whose role is not operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/articles/{id}:
    get:
      operationId: getArticle
      tags:
        - articles
      summary: Look up one article
      description: |
        Returns one article by its id. Ids compare ignoring case. A miss is a
        404 whose hint points to search.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The article id: its path under `articles/` without `.md` (ADR 0015).
            The id is one path segment (ADR 0016). A `/` inside a nested id is
            sent percent-encoded as `%2F`, as generated clients do:
            `platform/deploy` is requested as `/api/v1/articles/platform%2Fdeploy`.
            A bare slash (`/api/v1/articles/platform/deploy`) is not an article
            lookup and answers the not-found envelope. Ids in response bodies
            are always decoded.
          schema:
            type: string
            minLength: 1
          example: platform/deploy
        - name: project
          in: query
          required: false
          description: |
            Look the article up for this Project (ADR 0020): its own article
            wins over the global one with the same id. Matched ignoring case.
            An unregistered Project answers the global article with a `hint`; a
            value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: '`project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No bearer token, or a wrong one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The lookup asked for drafts with a token whose role is not operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No article has this id; the hint points to search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/skills:
    get:
      operationId: listSkills
      tags:
        - skills
      summary: List the skills
      description: |
        Returns the skills that answer in the Project's view, sorted by name, one
        per name: the nearest Scope wins with its whole bundle. Each carries its
        file list, `scope`, `status`, `description` and `requires_sync`. A
        draft skill is listed only with `drafts=true` and the operator role.

        Fetch one of a skill's files with `getSkillFile`
        (`GET /api/v1/skills/{name}/files/{path}`).
      parameters:
        - name: project
          in: query
          required: false
          description: |
            Resolve for this Project (ADR 0020): its own entry wins over the
            global one with the same name. Matched ignoring case. An
            unregistered Project answers the global view with a `hint`; a value
            that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillList"
        "400":
          description: 'For the skill list, `project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 'For the skill list, no bearer token was sent, or it is wrong.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 'For the skill list, drafts were asked for with a token whose role is not operator.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/skills/{name}:
    get:
      operationId: getSkill
      tags:
        - skills
      summary: Read one skill
      description: |
        Returns one skill by name with its file list. A client reads each listed
        `files[].path` with `GET /api/v1/skills/{name}/files/{path}`. A miss is a
        404 whose hint points to the list. The digest and the executable bit
        are not part of the answer yet.
      parameters:
        - name: name
          in: path
          required: true
          description: The skill name, one path segment. A name that is not one is a miss.
          schema:
            type: string
            minLength: 1
          example: deploy
        - name: project
          in: query
          required: false
          description: |
            Resolve the skill for this Project (ADR 0020): its own entry wins over the
            global one with the same name. Matched ignoring case. An
            unregistered Project answers the global view with a `hint`; a value
            that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          description: 'For the skill read, `project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 'For the skill read, no bearer token was sent, or it is wrong.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 'For the skill read, drafts were asked for with a token whose role is not operator.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No skill has this name; the hint points to the skill list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/skills/{name}/files/{path}:
    get:
      operationId: getSkillFile
      tags:
        - skills
      summary: Read one file of a skill
      description: |
        Returns the bytes of one file of the skill's bundle exactly as written,
        for a path listed in the skill's `files`. Every file is served with the
        one content type `application/octet-stream` and
        `X-Content-Type-Options: nosniff`, whatever its name or content, so a
        client or browser never runs or renders it. A name or path that is not a
        file of the bundle that answers, one that leaves the bundle, and an
        absolute path are all the same 404.
      parameters:
        - name: name
          in: path
          required: true
          description: The skill name, one path segment. A name that is not one is a miss, as is one that no skill has.
          schema:
            type: string
            minLength: 1
          example: deploy
        - name: path
          in: path
          required: true
          description: |
            The file's path relative to the bundle, one path segment (ADR 0016).
            A `/` inside it is sent percent-encoded as `%2F`: `scripts/run.sh`
            is requested as `/api/v1/skills/deploy/files/scripts%2Frun.sh`. A
            bare slash does not match this operation and answers the not-found
            envelope.
          schema:
            type: string
            minLength: 1
          example: SKILL.md
        - name: project
          in: query
          required: false
          description: |
            Resolve the skill for this Project (ADR 0020): its bundle answers
            whole, so a file only the global bundle has is a miss. Matched
            ignoring case. An unregistered Project answers the global bundle; a
            value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The file's bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: 'For the skill file, `project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 'For the skill file, no bearer token was sent, or it is wrong.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 'For the skill file, drafts were asked for with a token whose role is not operator.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No such skill, or the path is not a file of its bundle; the hint points to the skill list and the skill's files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agents:
    get:
      operationId: listAgents
      tags:
        - agents
      summary: List the agents
      description: |
        Returns the agents that answer in the Project's view, sorted by name,
        one per name: the nearest Scope wins. Each carries its `scope` and
        `status`. A draft agent is listed only with `drafts=true` and the
        operator role.
      parameters:
        - name: project
          in: query
          required: false
          description: |
            Resolve the agent list for this Project (ADR 0020): its own entry wins over the
            global one with the same name. Matched ignoring case. An
            unregistered Project answers the global view with a `hint`; a value
            that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "400":
          description: 'For the agent list, `project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 'For the agent list, no bearer token was sent, or it is wrong.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 'For the agent list, drafts were asked for with a token whose role is not operator.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agents/{name}:
    get:
      operationId: getAgent
      tags:
        - agents
      summary: Read one agent
      description: |
        Returns one agent by name. A miss is a 404 whose hint points to the list.
      parameters:
        - name: name
          in: path
          required: true
          description: The agent name, one path segment. A name that is not one is a miss.
          schema:
            type: string
            minLength: 1
          example: reviewer
        - name: project
          in: query
          required: false
          description: |
            Resolve the agent for this Project (ADR 0020): its own entry wins over the
            global one with the same name. Matched ignoring case. An
            unregistered Project answers the global view with a `hint`; a value
            that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: 'For the agent read, `project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 'For the agent read, no bearer token was sent, or it is wrong.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 'For the agent read, drafts were asked for with a token whose role is not operator.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No agent has this name; the hint points to the agent list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/loops:
    get:
      operationId: listLoops
      tags:
        - loops
      summary: List the loops
      description: |
        Returns the loops that answer in the Project's view, sorted by name, one per
        name: the nearest Scope wins. Each entry carries its resolved closure, the
        agents and skills it names as they resolve in this view, and the `digest` of
        the loop and its closure. A loop whose agent or skill does not resolve in the
        view (for example one the Project suppresses) is left out.
      parameters:
        - name: project
          in: query
          required: false
          description: |
            Resolve the loop list for this Project (ADR 0020): its own entry wins over the
            global one with the same name, and each closure resolves in this view. Matched
            ignoring case. An unregistered Project answers the global view with a `hint`;
            a value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The loops.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopList"
        "400":
          description: 'For the loop list, `project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 'For the loop list, no bearer token was sent, or it is wrong.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 'For the loop list, drafts were asked for with a token whose role is not operator.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/loops/{name}:
    get:
      operationId: getLoop
      tags:
        - loops
      summary: Read one loop
      description: |
        Returns one loop by name with its iteration prompt (`content`), its resolved
        closure and its `digest`. A miss is a 404 whose hint points to the list.
      parameters:
        - name: name
          in: path
          required: true
          description: The loop name, one path segment. A name that is not one is a miss.
          schema:
            type: string
            minLength: 1
          example: nightly
        - name: project
          in: query
          required: false
          description: |
            Resolve the loop named in the path for this Project (ADR 0020): its own entry
            wins over the global one with the same name, and the closure resolves in this
            view. Matched ignoring case. An unregistered Project answers the global view
            with a `hint`; a value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - $ref: "#/components/parameters/Drafts"
      responses:
        "200":
          description: The loop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loop"
        "400":
          description: 'For the loop read, `project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 'For the loop read, no bearer token was sent, or it is wrong.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 'For the loop read, drafts were asked for with a token whose role is not operator.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No loop has this name in the view; the hint points to the loop list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/instructions:
    get:
      operationId: getInstructions
      tags:
        - instructions
      summary: Read the instruction block
      description: |
        Returns the instruction block for the Project and target: the clauses that
        resolve in the Project's view and name the target, in order, with the
        variables replaced. `{{mcp_name}}` is the server setting
        `GOLDIE_MCP_NAME` (default `goldie`) and `{{cli}}` is `goldie`. When no
        clause applies, the block is the built-in default. The `digest` is the
        hex SHA-256 of the block, so a client can tell whether its copy is current.
      parameters:
        - name: target
          in: query
          required: true
          description: |
            The file the block is written into: `claude` (CLAUDE.md) or `agents`
            (AGENTS.md). Anything else, or none, is a 400.
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: |
            Render for this Project (ADR 0020): its own clauses win over the
            global ones with the same name. Matched ignoring case. An
            unregistered Project answers the global block with a `hint`; a value
            that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
      responses:
        "200":
          description: The block and its digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructionBlock"
        "400":
          description: 'For the instruction block, `target` is missing or not a known target (the hint names them), or `project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 'For the instruction block, no bearer token was sent, or it is wrong.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/bundle:
    get:
      operationId: getBundle
      tags:
        - bundle
      summary: Download the resolved set as an archive
      description: |
        Returns the skills and agents that resolve in the Project's view (the
        view of `GET /api/v1/skills` and `GET /api/v1/agents`: the nearest Scope
        wins, drafts are left out) as a gzip-compressed tar, laid out for the
        target. For `claude` the entries are regular files with clean relative
        slash paths: `.claude/skills/goldie-<name>/<path in the bundle>` for each
        file of each skill and `.claude/agents/goldie-<name>.md` for each agent.
        A script keeps its executable bit in the entry's mode. A skill or agent
        whose name, or a skill file whose path, cannot be a safe path is left out
        on purpose, and nothing in the response marks the omission. A Project
        whose view holds no skill and no agent gets a 200 with an empty archive and
        a stable `ETag`. The `ETag` is the digest of the set, quoted: the same set
        always gives the same ETag. Compare ETags, not bytes: gzip output can
        change between Go toolchains. `If-None-Match` with that ETag answers 304
        with no body. `goldie pull` writes the archive into the Goldie namespace.
      parameters:
        - name: target
          in: query
          required: true
          description: The layout of the archive. `claude` is the only target. Anything else, or none, is a 400.
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: |
            Resolve for this Project (ADR 0020). Matched ignoring case. An
            unregistered Project answers the global set; a value that is not a
            `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of the archive the client already has.
          schema:
            type: string
      responses:
        "200":
          description: The archive.
          headers:
            ETag:
              description: The digest of the set, in double quotes.
              required: true
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "304":
          description: The set is the one `If-None-Match` names. No body.
          headers:
            ETag:
              description: The digest of the set, unchanged, in double quotes.
              required: true
              schema:
                type: string
        "400":
          description: 'For the bundle, `target` is missing or not a known target, or `project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 'For the bundle, no bearer token was sent, or it is wrong.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      tags:
        - projects
      summary: List the registered Projects
      description: |
        Returns the Projects the server holds Scope for, sorted, as
        `host/org/repo` in the case they are stored in. A server with none
        answers an empty list. Pass one as `project` on search and lookup.
      responses:
        "200":
          description: The Projects the server holds, sorted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          description: No bearer token was sent, or it is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      tags:
        - projects
      summary: Read one registered Project
      description: |
        Returns the Project's id, in the case the server stores it, and the
        global Items its `project.yaml` suppresses (ADR 0021) as
        `<kind>:<id>` (for example `article:style` or `agent:reviewer`), sorted. A Project that suppresses nothing answers an
        empty list. A lookup of a suppressed Item answers 404 with a hint that
        names the Suppression and the file that sets it, and search leaves it
        out.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The Project as one path segment (ADR 0016): the `/` inside
            `host/org/repo` is sent percent-encoded as `%2F`, so
            `github.com/acme/shop` is requested as
            `/api/v1/projects/github.com%2Facme%2Fshop`. Matched ignoring case.
            A bare-slash path is not a Project detail and answers the not-found
            envelope; a value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
          example: github.com/acme/shop
      responses:
        "200":
          description: The Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          description: The id is not a `ProjectId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No bearer token, or a wrong one; the body shows no Suppressions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The server holds no such Project; the hint says how to register it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/items:
    get:
      operationId: getProjectItems
      tags:
        - projects
      summary: Export a Project's resolved view
      description: |
        Returns the articles that win in the Project's view (Resolution): the
        Project's own copy over the global one with the same id, every global
        Item the Project does not shadow or suppress, and no draft. Only
        winners are sent: nothing of another Project and no shadowed copy.
        Sorted by `id`, ascending. Each Item carries its `scope` and whether it
        is `enforced`, so an embedded server can build on this view and check
        that a local Item does not shadow an enforced one. The Project's
        Suppressions (ADR 0021) are listed as in `getProject`.

        A Project the server does not hold is answered with the global view and
        a `hint`, as search and lookup do. A view over the export limit, the
        same 16 MiB the goldie client reads, is refused whole with 422
        `view_too_large`; it is never truncated, because a partial view would
        hide enforced Items.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The Project as one path segment (ADR 0016): the `/` inside
            `host/org/repo` is sent percent-encoded as `%2F`. Matched ignoring
            case. A bare-slash path is not this route and answers the not-found
            envelope; a value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
          example: github.com/acme/shop
      responses:
        "200":
          description: The Project's resolved view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectView"
              example:
                items:
                  - id: platform/deploy
                    name: Deploying to Kubernetes
                    keywords:
                      - kubernetes
                      - deploy
                    content: Use the platform chart.
                    status: published
                    scope: github.com/acme/shop
                    enforced: false
                suppressions:
                  - article:platform/notes
        "400":
          description: The id sent is not a valid `ProjectId`; the body does not repeat it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No bearer token, or a wrong one; the body shows no Item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: |
            The view is over the export limit; the error code is
            `view_too_large`. Nothing of the view is sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/session:
    post:
      operationId: postSession
      security: []
      tags:
        - session
      summary: Sign in with a token and get a session cookie
      description: |
        Exchanges a configured API token, sent as `token` in the JSON body,
        for a signed session cookie, so a browser never holds the token. The
        cookie is `HttpOnly`, `SameSite=Strict` and `Path=/`, and over TLS
        `Secure` with the `__Host-` prefix (both dropped only on the
        plain-http loopback dev server, `goldie server --dev`; any other
        server, one behind a TLS proxy included, always sets both). It names
        the token and its times under a signature (ADR 0027), expires after 30
        minutes without use (each request with the cookie extends it) and 7
        days after sign-in at the latest, and ends when the token is removed or
        given a new value. It authenticates `GET` and `HEAD`. It authenticates
        an unsafe method only from a same-origin request that also sends the
        CSRF token (`X-Goldie-CSRF`, returned here and by `GET
        /api/v1/session`); a cross-site `Origin` or `Sec-Fetch-Site`, or a
        missing or wrong token, is a 403. The client sends the token back in an
        `X-Goldie-CSRF` request header on each unsafe request. A bearer token
        beats the cookie, and a bearer caller gets and needs no CSRF token.
        This operation takes no bearer token, and a
        cross-origin request is refused with a 403. Failed sign-ins are
        capped per remote address: past the cap within a window, every
        sign-in from that address, a valid token included, is refused with a
        429 until the window ends. The key is the connection's remote
        address (an IPv6 address by its /64); `X-Forwarded-For` and similar
        headers are ignored, so clients behind a reverse proxy share one key
        and one lockout. The cap is per server process, and successful
        sign-ins do not count. The server tracks a bounded number of
        addresses; past it, new addresses share one count, so a flood of
        addresses can lock sign-in for addresses not yet tracked. The
        response is `Cache-Control: no-store`.
      requestBody:
        required: true
        description: The API token to sign in with.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
            example:
              token: replace-with-a-configured-api-token
      responses:
        "200":
          description: The token is valid; the session cookie is in `Set-Cookie` and the CSRF token in `X-Goldie-CSRF`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                name: ci-reader
                role: reader
        "401":
          description: The body holds no configured token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The request came from another origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: |
            This remote address made too many failed sign-ins. The answer is the same
            for a valid and an invalid token. Wait the seconds in
            `Retry-After`, then retry.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: getSession
      tags:
        - session
      summary: Read who the session cookie signs in
      description: |
        Returns the name and current role of the token behind a valid
        session cookie (or a bearer token); a token removed from the
        configuration ends its sessions. Any other request is a 401. The
        response is `Cache-Control: no-store`.
      responses:
        "200":
          description: The caller. With a session cookie, the CSRF token is in `X-Goldie-CSRF`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                name: ci-reader
                role: reader
        "401":
          description: No valid session cookie or bearer token was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      security: []
      tags:
        - session
      summary: Sign out
      description: |
        Clears the session cookie. A cross-origin request is refused with a
        403, so another site cannot sign a user out. The response is
        `Cache-Control: no-store`.
      responses:
        "204":
          description: The cookie is cleared in `Set-Cookie`.
        "403":
          description: The sign-out came from another origin, so the cookie is kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sync:
    get:
      operationId: getSync
      x-goldie-role: operator
      tags:
        - sync
      summary: Read the content sync status and warnings
      description: |
        Returns, per Source, the revision served and when it was last polled,
        when that last succeeded and why it last failed, and the findings of the
        last content load that did not fail it, for
        operator tokens only, such as a `suppress` reference that names nothing
        in a Project's `project.yaml`. Each warning names a file relative to the
        Source root and shows what the Source wrote escaped to printable ASCII
        and cut, which is why only operators read them. `goldie validate` prints
        the same warnings for a content directory.
      responses:
        "200":
          description: The warnings of the current content, empty when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
              example:
                sources:
                  - revision: 3f786850e387550fdab836ed7e6dc881de23001b
                    last_poll: "2026-11-23T10:00:00Z"
                    last_success: "2026-11-23T10:00:00Z"
                warnings:
                  - file: projects/github.com/acme/shop/project.yaml
                    message: suppress "article:team/gone" names no published Item this Project can see
        "401":
          description: No bearer token was sent for the sync status, or it is not a configured token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: A reader token was sent for the sync status; only an operator token may read it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: postSync
      x-goldie-role: operator
      tags:
        - sync
      summary: Poll the Source now
      description: |
        Starts one poll of the Source now instead of waiting for
        `GOLDIE_POLL_INTERVAL`, for operator tokens only, and answers at once
        without waiting for it, for example after merging into the repository a
        git Source reads. Read the outcome from `GET /api/v1/sync`: `last_poll`
        moves when the poll ends, `revision` when it found a new commit, and
        `last_error` when it failed. The request takes no body. At most one
        poll runs at a time.
      responses:
        "202":
          description: A poll was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncTriggered"
              example:
                hint: A poll was started. Read GET /api/v1/sync to see its outcome.
        "401":
          description: No bearer token was sent to trigger a poll, or it is not a configured token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: A reader token was sent to trigger a poll; only an operator token may.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          description: |
            A poll is already running, so none was started (`error.code` is
            `sync_running`), or the token sent more requests than
            `GOLDIE_RATE_LIMIT` allows (`rate_limited`, with `Retry-After`).
            Wait, then read `GET /api/v1/sync`.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/NotReady"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/activity:
    get:
      operationId: getActivity
      x-goldie-role: operator
      tags:
        - activity
      summary: Stream recent searches and lookups
      parameters:
        - name: replicas
          in: query
          required: false
          description: |
            `all` merges the streams of every replica (see the description);
            without it the stream is this replica's own. Any other value, and
            a repeated parameter, is a 400.
          schema:
            type: string
            enum:
              - all
      description: |
        Streams this server process's recent searches and lookups as
        server-sent events, for operator tokens only. The stream opens with the
        retained events in `id` order, oldest first, then one event of type
        `live` whose `data` is `{}` (an `ActivityLive`), sent even when there
        is no history, then each new event as it is recorded. It is a live
        view, not an audit log: the buffer is bounded and shared, so any
        reader's requests push older events out of it, and a restart empties
        it.

        With `replicas=all` the stream merges this replica's stream with one
        per peer, as `GOLDIE_ACTIVITY_PEERS` names them; without peers it is
        this replica's stream. An event of type `replica_status` (an
        `ActivityReplicaStatus`) says a peer is down, and again when it is
        back; those for peers that are down when the stream opens come before
        the merged history. Each peer is asked with the caller's own token for
        its own events only, and checks the operator role itself. A peer is
        down when its stream ends or falls silent, or sends no `live` marker.
        An event that reached the merge after its reorder window carries
        `late: true`, and `dropped` counts the merge's own losses. At most 16
        peers are merged; the rest are ignored.

        Every event is one SSE event whose `data` is one line of JSON, an
        `ActivityEvent`. Its `id` increases per server process (per replica)
        and starts again at 1 when the process restarts; `replica` names the
        replica that recorded it. All text is escaped
        as JSON strings, so no query can end an event or start one. A
        subscriber that cannot keep up loses events and then gets an event of
        type `dropped`, an `ActivityDropped` with the number lost, before the
        next event. Clients must ignore SSE event types and JSON fields they
        do not know.

        Events carry no SSE `id:` field and the server does not resume from
        `Last-Event-ID`: a reconnect replays the retained history, so on
        reconnect clients replace their view with the history before `live`.
        Within one connection they dedupe by `replica` and `id`; across
        connections ids are no key, because they start again at 1 when a
        replica restarts under the same name. An idle stream sends the
        comment `: keepalive` every 15 seconds. The stream costs one
        rate-limit token when it opens, and ends at the server's first stop
        signal. At most 32 streams are open per server process, and at most 8
        of them with `replicas=all`, each of which costs a stream on every
        peer; one more is a 503 whose hint says to retry later. The history
        before `live` holds at most 10,000 events per replica, so a merged
        history can be larger, and the Go client reads at most 16 MiB of the
        stream before `live`.

        Go clients use `StreamActivity` on the client `NewAPIClient` builds:
        `GetActivityWithResponse` reads the whole body, so it does not return
        until the stream ends.
      responses:
        "200":
          description: |
            The event stream, not an audit log. Sent with
            `Cache-Control: no-store`; the headers are sent before the first
            event, at once, except with `replicas=all`, which first waits up to
            a few seconds for its peers.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE events. The `data` of each is one line of JSON, one of
                  `contentSchema`: an `ActivityEvent` for an event without a
                  type, an `ActivityDropped` for `dropped`, an
                  `ActivityReplicaStatus` for `replica_status` and an
                  `ActivityLive` for `live`.
                contentSchema:
                  oneOf:
                    - $ref: "#/components/schemas/ActivityEvent"
                    - $ref: "#/components/schemas/ActivityDropped"
                    - $ref: "#/components/schemas/ActivityReplicaStatus"
                    - $ref: "#/components/schemas/ActivityLive"
              example: |
                data: {"id":1,"time":"2026-11-23T10:00:00Z","kind":"search","query":"deploy","project":"","token":"ci","client_version":"1.5.0","trace_id":"","miss":false,"replica":"goldie-0","late":false}

                event: live
                data: {}
        "400":
          description: '`replicas` is not `all`, or is repeated.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The bearer token is missing or not a configured token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The token is valid but its role is not operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |
            The server cannot open a stream: it has not loaded its content yet
            (code `not_ready`), it already serves the most streams it allows
            (code `too_many_streams`), or it is shutting down (code
            `shutting_down`). The hint says when to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      tags:
        - contract
      summary: Get the OpenAPI document as YAML
      description: Returns this document in YAML form.
      responses:
        "200":
          description: The OpenAPI document in YAML form.
          content:
            application/yaml:
              schema:
                type: string
              example: "openapi: 3.1.0"
        default:
          $ref: "#/components/responses/Error"
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      tags:
        - contract
      summary: Get the OpenAPI document as JSON
      description: Returns this document in JSON form. It is equivalent to the YAML form.
      responses:
        "200":
          description: The OpenAPI document in JSON form.
          content:
            application/json:
              schema:
                type: object
              example:
                openapi: 3.1.0
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A goldie token, sent as `Authorization: Bearer <token>`. Swagger UI's
        "Authorize" button takes it, so "Try it out" sends it. The server
        enforces it on every `/api/` path, where a missing or wrong token is a
        401, and limits each token's requests (`GOLDIE_RATE_LIMIT`), where a
        token over its limit is a 429 with `Retry-After`. An operation for
        operators only, such as `/api/v1/activity` and `/api/v1/sync`, answers other tokens with a
        403; those operations carry the machine-readable mark `x-goldie-role: operator`. A parameter value for operators only,
        `drafts=true`, carries the same mark on `components/parameters/Drafts`. The OpenAPI document and Swagger UI are not yet covered; the auth
        work (#11) adds them.
  parameters:
    Drafts:
      name: drafts
      in: query
      required: false
      x-goldie-role: operator
      description: |
        `true` includes draft Items too, marked `status: draft`; for operator
        tokens only, and a reader token asking for drafts is a 403. Without
        it a draft is left out for every token and never shadows, so the
        published Item answers. Even with drafts, a draft Project article
        never shadows an enforced global Item (ADR 0021). MCP never asks
        for drafts.
      schema:
        type: boolean
  schemas:
    SearchResults:
      type: object
      description: The result of a search.
      examples:
        - query: kubernetes
          results:
            - id: platform/deploy
              name: Deploying to Kubernetes
              kind: article
              scope: global
              keywords:
                - kubernetes
                - deploy
              score: 6
              matched:
                - kubernetes
                - name
              overrides:
                - global
              enforced: false
      required:
        - query
        - results
      properties:
        query:
          type: string
          description: The search words as received.
          examples:
            - deploy kubernetes
        results:
          type: array
          description: The matching Items, best first, then by id.
          items:
            $ref: "#/components/schemas/SearchHit"
          examples:
            - []
        hint:
          type: string
          minLength: 1
          description: |
            Present when the request named a Project that is not registered: the
            results are the global ones, and this says what to do next.
          examples:
            - The Project github.com/acme/none is not registered on this server, so this is global guidance only. To register it, add a projects/github.com/acme/none/ directory to one of goldie's Sources, usually through the platform team.
    ProjectId:
      type: string
      description: |
        A Project: exactly three segments `host/org/repo` (ADR 0020). The host
        is a lower-case DNS name that starts with a letter or digit; the org and
        the repo use letters, digits, `.`, `_` and `-` and do not start with a
        dot. Clients send it lower-cased; the server matches it ignoring case.
      pattern: '^[a-z0-9][a-z0-9.-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*$'
      maxLength: 512
      examples:
        - github.com/acme/shop
    ProjectList:
      type: object
      description: The Projects the server holds Scope for.
      required:
        - projects
      properties:
        projects:
          type: array
          description: The Projects, sorted.
          items:
            $ref: "#/components/schemas/ProjectId"
          examples:
            - - github.com/acme/shop
