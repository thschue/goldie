openapi: 3.1.0
info:
  title: Goldie API
  summary: Golden-path knowledge for humans and agents.
  description: |
    The public HTTP API of the goldie server. This document is the contract:
    the Go and TypeScript types are generated from it, and it is served by the
    server itself at `/openapi.yaml` and `/openapi.json`.

    The admin endpoints (`/livez`, `/readyz`, `/version`) are served on the
    separate admin port and are not part of this document.
  version: 0.1.0
  contact:
    name: Goldie maintainers
    url: https://github.com/thschue/goldie
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
    description: The public listener that served this document.
security:
  - bearerAuth: []
tags:
  - name: contract
    description: The API contract itself.
  - name: articles
    description: Search and look up articles.
  - name: projects
    description: The Projects whose Scope the server holds.
paths:
  /api/v1/search:
    get:
      operationId: searchArticles
      tags:
        - articles
      summary: Search articles by keyword
      description: |
        Returns the articles that match the search words, best first. An exact
        keyword match scores 4, a keyword containing the word 1, and a name
        containing the word 2. Ties are ordered by id. No match is an empty
        list, not an error.
      parameters:
        - name: q
          in: query
          required: true
          description: Search words, separated by spaces. Matching ignores case.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
          example: deploy kubernetes
        - name: project
          in: query
          required: false
          description: |
            Resolve for this Project (ADR 0020): its articles come before the
            global ones and win on an equal id. Matched ignoring case. A Project
            that is not registered answers the global results with a `hint`; a
            value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
      responses:
        "200":
          description: The matching articles, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: The search words are missing or longer than 1024 bytes, or `project` is not a `ProjectId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/articles/{id}:
    get:
      operationId: getArticle
      tags:
        - articles
      summary: Look up one article
      description: |
        Returns one article by its id. Ids compare ignoring case. A miss is a
        404 whose hint points to search.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The article id: its path under `articles/` without `.md` (ADR 0015).
            The id is one path segment (ADR 0016). A `/` inside a nested id is
            sent percent-encoded as `%2F`, as generated clients do:
            `platform/deploy` is requested as `/api/v1/articles/platform%2Fdeploy`.
            A bare slash (`/api/v1/articles/platform/deploy`) is not an article
            lookup and answers the not-found envelope. Ids in response bodies
            are always decoded.
          schema:
            type: string
            minLength: 1
          example: platform/deploy
        - name: project
          in: query
          required: false
          description: |
            Look the article up for this Project (ADR 0020): its own article
            wins over the global one with the same id. Matched ignoring case.
            An unregistered Project answers the global article with a `hint`; a
            value that is not a `ProjectId` is a 400.
          schema:
            $ref: "#/components/schemas/ProjectId"
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: '`project` is not a `ProjectId`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No bearer token, or a wrong one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No article has this id; the hint points to search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      tags:
        - projects
      summary: List the registered Projects
      description: |
        Returns the Projects the server holds Scope for, sorted, as
        `host/org/repo` in the case they are stored in. A server with none
        answers an empty list. Pass one as `project` on search and lookup.
      responses:
        "200":
          description: The Projects the server holds, sorted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          description: No bearer token was sent, or it is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      tags:
        - contract
      summary: Get the OpenAPI document as YAML
      description: Returns this document in YAML form.
      responses:
        "200":
          description: The OpenAPI document in YAML form.
          content:
            application/yaml:
              schema:
                type: string
              example: "openapi: 3.1.0"
        default:
          $ref: "#/components/responses/Error"
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      tags:
        - contract
      summary: Get the OpenAPI document as JSON
      description: Returns this document in JSON form. It is equivalent to the YAML form.
      responses:
        "200":
          description: The OpenAPI document in JSON form.
          content:
            application/json:
              schema:
                type: object
              example:
                openapi: 3.1.0
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A goldie token, sent as `Authorization: Bearer <token>`. Swagger UI's
        "Authorize" button takes it, so "Try it out" sends it. The server
        enforces it on every `/api/` path, where a missing or wrong token is a
        401, and limits each token's requests (`GOLDIE_RATE_LIMIT`), where a
        token over its limit is a 429 with `Retry-After`. The OpenAPI document and Swagger UI are not yet covered; the auth
        work (#11) adds them.
  schemas:
    SearchResults:
      type: object
      description: The result of a search.
      examples:
        - query: kubernetes
          results:
            - id: platform/deploy
              name: Deploying to Kubernetes
              kind: article
              scope: global
              keywords:
                - kubernetes
                - deploy
              score: 6
              matched:
                - kubernetes
                - name
      required:
        - query
        - results
      properties:
        query:
          type: string
          description: The search words as received.
          examples:
            - deploy kubernetes
        results:
          type: array
          description: The matching articles, best first, then by id.
          items:
            $ref: "#/components/schemas/SearchHit"
          examples:
            - []
        hint:
          type: string
          minLength: 1
          description: |
            Present when the request named a Project that is not registered: the
            results are the global ones, and this says what to do next.
          examples:
            - The Project github.com/acme/none is not registered on this server, so this is the global answer. To register it, add a projects/github.com/acme/none/ directory to one of goldie's Sources, usually through the platform team.
    ProjectId:
      type: string
      description: |
        A Project: exactly three segments `host/org/repo` (ADR 0020). The host
        is a lower-case DNS name that starts with a letter or digit; the org and
        the repo use letters, digits, `.`, `_` and `-` and do not start with a
        dot. Clients send it lower-cased; the server matches it ignoring case.
      pattern: '^[a-z0-9][a-z0-9.-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*$'
      maxLength: 512
      examples:
        - github.com/acme/shop
    ProjectList:
      type: object
      description: The Projects the server holds Scope for.
      required:
        - projects
      properties:
        projects:
          type: array
          description: The Projects, sorted.
          items:
            $ref: "#/components/schemas/ProjectId"
          examples:
            - - github.com/acme/shop
    SearchHit:
      type: object
      description: One article that matched a search.
      examples:
        - id: platform/deploy
          name: Deploying to Kubernetes
          kind: article
          scope: global
          keywords:
            - kubernetes
            - deploy
          score: 6
          matched:
            - kubernetes
            - name
      required:
        - id
        - name
        - kind
        - scope
        - keywords
        - score
        - matched
      properties:
        id:
          type: string
          description: The article id, for a lookup.
          examples:
            - platform/deploy
        name:
          type: string
          description: The display title from the frontmatter.
          examples:
            - Deploying to Kubernetes
        kind:
          type: string
          description: The Kind of the Item, such as `article` (ADR 0005).
          examples:
            - article
        scope:
          type: string
          description: Where the Item applies, such as `global` (ADR 0005).
          examples:
            - global
        keywords:
          type: array
          description: The article's keywords, lower case.
          items:
            type: string
          examples:
            - - kubernetes
              - deploy
        score:
          type: integer
          minimum: 1
          description: The relevance score; higher is better.
          examples:
            - 6
        matched:
          type: array
          description: What matched, in order of first match - keywords, and `name` when the name matched.
          items:
            type: string
          examples:
            - - kubernetes
              - name
    Article:
      type: object
      description: One article.
      required:
        - id
        - name
        - keywords
        - content
      properties:
        id:
          type: string
          description: The article id, its path under `articles/` without `.md`.
          examples:
            - platform/deploy
        name:
          type: string
          description: The article's display title, from its frontmatter.
          examples:
            - Deploying to Kubernetes
        keywords:
          type: array
          description: The keywords from the article's frontmatter, lower case.
          items:
            type: string
          examples:
            - - kubernetes
              - deploy
        content:
          type: string
          description: The Markdown body after the frontmatter. It comes from a Source and is untrusted; render it without raw HTML.
          examples:
            - "Use the platform chart."
        hint:
          type: string
          minLength: 1
          description: |
            Present when the request named a Project that is not registered: the
            article is the global one, and this says what to do next.
          examples:
            - The Project github.com/acme/none is not registered on this server, so this is the global answer. To register it, add a projects/github.com/acme/none/ directory to one of goldie's Sources, usually through the platform team.
    ErrorEnvelope:
      type: object
      description: The body of every error response.
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      description: One error. It never contains addresses, paths or stack traces.
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          description: A stable, machine-readable error code.
          examples:
            - not_found
        message:
          type: string
          description: A short, human-readable explanation.
          examples:
            - no such endpoint
        details:
          description: Next-step hints for the caller.
          $ref: "#/components/schemas/ErrorDetails"
    ErrorDetails:
      type: object
      description: |
        Next-step hints for the caller, and nothing else. It never echoes the
        request and never contains addresses, ports, hostnames, paths or stack
        traces. It is required, so a client can always read it, and always
        carries a hint.
      additionalProperties: false
      required:
        - hint
      properties:
        hint:
          type: string
          minLength: 1
          description: What the caller can do next.
          examples:
            - Check the request path against the OpenAPI document.
  responses:
    Error:
      x-go-name: ErrorResponse
      description: An error, in the error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpgradeRequired:
      description: |
        The request named a goldie client older than `GOLDIE_MIN_CLIENT_VERSION`
        in its `X-Goldie-Client: goldie/<version>` header. The hint names the
        minimum version: upgrade goldie, then retry. Requests without the
        header, or whose header is not `goldie/<semver>`, are not refused;
        requests without a valid token are rejected with 401 first, and a
        refused request does not count against the rate limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: |
        The token sent more requests than `GOLDIE_RATE_LIMIT` allows. The limit
        is per token name and per server process; requests without a valid
        token are rejected with 401 first and never count. Wait the seconds in
        `Retry-After`, then retry.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  headers:
    RetryAfter:
      description: Whole seconds until the token may send a request again, rounded up; at least 1.
      schema:
        type: integer
        minimum: 1
      example: 30
